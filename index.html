<style>
:root{
  --bg:#F4F6F9; --surface:#fff; --navy:#17345B; --navy-dark:#102846;
  --accent:#1A83C6; --text:#1D2530; --muted:#6D7480; --line:#DDE2E8;
  --amber:#9A6811; --amber-bg:#FFF5DD; --green:#2C6B4D; --green-bg:#EAF6EF;
  --red:#A93D3D; --red-bg:#FDEEEE; --blue-bg:#EAF3FB;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"NanumBarunGothic","나눔바른고딕","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--navy-dark);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;min-height:66px;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.brand-logo-wrap{height:38px;min-width:112px;background:#fff;border-radius:6px;padding:7px 10px;display:flex;align-items:center;justify-content:center}.brand-logo{display:block;height:21px;width:auto;max-width:128px;object-fit:contain}.brand-title{font-weight:800;font-size:18px}
.tabs{display:flex;gap:5px}.tab-btn{border:0;background:transparent;color:#C6D2E2;padding:10px 15px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}.tab-btn:hover{background:rgba(255,255,255,.08);color:#fff}.tab-btn.active{background:var(--accent);color:#fff}
main{flex:1;padding:34px 20px 70px;display:flex;justify-content:center}.container{width:100%;max-width:980px}
h1.page-title{font-size:23px;margin:0 0 7px}.page-sub{margin:0 0 24px;color:var(--muted);font-size:14px;line-height:1.55}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:26px;margin-bottom:18px;box-shadow:0 2px 7px rgba(22,42,72,.035)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px 20px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field.third{grid-column:span 1}
label{font-size:13px;font-weight:800;color:var(--navy)}label .req{color:#BF3E3E;margin-left:2px}
input,select,textarea{width:100%;border:1px solid #D3D8E0;border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;color:var(--text);background:#fff}input:focus,select:focus,textarea:focus{outline:2px solid rgba(26,131,198,.22);border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);line-height:1.45}.logo-preview{height:54px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;padding:7px 12px}.logo-preview img{max-height:38px;max-width:185px;object-fit:contain}
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:8px;padding:11px 19px;font-size:14px;font-weight:800;cursor:pointer;gap:6px}.btn:disabled{opacity:.42;cursor:not-allowed}.btn-primary{background:var(--navy);color:#fff}.btn-accent{background:var(--accent);color:#fff}.btn-outline{background:#fff;color:var(--navy);border:1px solid var(--navy)}.btn-ghost{background:transparent;color:var(--muted)}.btn-danger{background:#fff;color:var(--red);border:1px solid #E8BABA}.btn-reject{background:#fff4f4;color:var(--red);border:1px solid #E8BABA}.btn-sm{padding:6px 11px;font-size:12.5px}.btn-row{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
.notice{border-radius:10px;padding:15px 17px;font-size:14px;line-height:1.6;margin-bottom:18px}.notice.success{background:var(--green-bg);border:1px solid #BFE3CD;color:#21533A}.notice.pending{background:var(--amber-bg);border:1px solid #ECD6A3;color:#79560E}.notice.info{background:var(--blue-bg);border:1px solid #C5DAED;color:#21486C}.notice.error{background:var(--red-bg);border:1px solid #F0C3C3;color:#7D2424}
.code-box{display:inline-block;padding:6px 12px;border:1px dashed var(--navy);border-radius:7px;font-weight:900;letter-spacing:1px;color:var(--navy);background:#fff}.lookup-form{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.lookup-form .field{min-width:210px;flex:1}
.stats{display:flex;gap:26px;flex-wrap:wrap}.stat .num{font-size:23px;font-weight:900;margin-top:2px}.stat.pending .num{color:var(--amber)}.stat.approved .num{color:var(--green)}.stat.rejected .num{color:var(--red)}
.filter-row{display:flex;gap:7px;flex-wrap:wrap}.filter-chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}.filter-chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}th{color:var(--muted);font-size:12px;font-weight:800}.status-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:800}.status-pill.pending{background:var(--amber-bg);color:var(--amber)}.status-pill.approved{background:var(--green-bg);color:var(--green)}.status-pill.rejected{background:var(--red-bg);color:var(--red)}.row-actions{display:flex;gap:5px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:38px 0}.login-box{max-width:380px;margin:50px auto 0}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.section-title{font-size:15px;font-weight:900;color:var(--navy);margin:6px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
/* 관리자 대시보드: 넓게 표시하고 목록은 한 줄 유지 */
.container.admin-wide{max-width:1680px;width:calc(100vw - 40px)}
.admin-table{width:100%;min-width:1420px;table-layout:auto}
.admin-table th,.admin-table td{white-space:nowrap;vertical-align:middle}
.admin-table .row-actions{flex-wrap:nowrap}
.admin-table td:nth-child(4){min-width:150px}
.admin-table td:nth-child(5){min-width:140px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.admin-table td:nth-child(6){min-width:175px;font-family:monospace}
.admin-table td:nth-child(7){min-width:135px}
.admin-table td:nth-child(8){min-width:135px}
.admin-table td:nth-child(10){min-width:255px}
/* Certificate */
.cert-stack{display:flex;flex-direction:column;gap:22px}.cert-page{width:210mm;min-height:297mm;background:#fff;margin:0 auto;box-shadow:0 3px 16px rgba(0,0,0,.10);position:relative;overflow:hidden;color:#111;font-family:"NanumBarunGothic","나눔바른고딕","Malgun Gothic",sans-serif}.cert-head{height:12mm;display:flex;align-items:flex-start;position:relative;overflow:hidden}.cert-logo{position:absolute;left:10mm;top:2mm;height:8mm;max-width:48mm;object-fit:contain;object-position:left center;z-index:2}.cert-band-img{position:absolute;right:0;top:0;width:37%;height:6mm;display:block;z-index:1;object-fit:fill}.cert-inner{padding:7mm 13mm 11mm}.cert-title{text-align:center;font-size:34pt;font-weight:700;letter-spacing:14pt;padding-left:14pt;margin:2mm 0 10mm}.cert-number{font-size:14pt;margin-bottom:2.5mm}.cert-table{width:100%;border-collapse:collapse;border-top:1.3px solid #111;border-bottom:1px solid #111;margin-bottom:5mm;table-layout:fixed}.cert-table td{border-bottom:1px solid #777;padding:3.4mm 3mm;font-size:15.5pt;line-height:1.35;vertical-align:middle}.cert-table tr:last-child td{border-bottom:none}.cert-table .label{width:24mm;background:#FAFAFA;text-align:center;font-weight:700;border-right:1px solid #777}.cert-table .label2{width:43mm;background:#FAFAFA;text-align:center;font-weight:700;border-left:1px solid #777;border-right:1px solid #777;white-space:nowrap}.cert-table .ssn-cell{white-space:nowrap;letter-spacing:-.3pt}.cert-sentence{font-size:17.5pt;line-height:1.5;margin:0 0 5mm}.cert-gap-one{height:1.5em;font-size:17.5pt;line-height:1.5}.cert-meta{font-size:17.5pt;line-height:1.5;margin:0 0 5mm 10mm}.cert-gap-two{height:3em;font-size:17.5pt;line-height:1.5}.cert-confirm{text-align:center;font-size:17.5pt;line-height:1.35;margin:0 0 3mm}.cert-date{text-align:center;font-size:17.5pt;line-height:1.35;margin-bottom:0}.cert-signoff{position:absolute;right:8mm;bottom:37mm;text-align:right;font-size:14pt;line-height:1.5;max-width:177mm}.ceo-line{display:inline-flex;align-items:center;justify-content:flex-end;position:relative;white-space:nowrap}.company-seal{width:23mm;margin-left:-7mm;margin-top:-1mm;mix-blend-mode:multiply;position:relative;z-index:2}.cert-issuer{position:absolute;right:8mm;bottom:11mm;font-size:12.5pt;line-height:1.3;display:flex;align-items:center;gap:0;white-space:nowrap}.issuer-seal{width:23mm;height:auto;margin-left:-7mm;mix-blend-mode:multiply;position:relative;z-index:2}.cert-foot{position:absolute;right:8mm;bottom:4.5mm;font-size:9.8pt;color:#555}.copy-mark{position:absolute;right:12mm;top:13mm;font-family:"NanumBarunGothic","나눔바른고딕","Malgun Gothic",sans-serif;font-size:9pt;color:#777}.pdf-capture{width:210mm!important;height:297mm!important;min-height:297mm!important;max-height:297mm!important;box-shadow:none!important;margin:0!important;overflow:hidden!important}
.company-missing{color:#A13D3D;font-weight:700}.modal-backdrop{position:fixed;inset:0;background:rgba(7,18,34,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 16px 48px rgba(0,0,0,.25)}
@media(max-width:760px){.form-grid,.settings-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.topbar{padding:10px 14px}.tabs{width:100%;overflow-x:auto}.tab-btn{white-space:nowrap}.cert-stack{overflow-x:auto}.cert-page{width:210mm;min-width:210mm;min-height:297mm}.cert-inner{padding:7mm 13mm 11mm}}
/* 출력: 증명서 1매를 A4 1페이지에 정확히 맞춤 */
@page{size:A4 portrait;margin:0}
@media print{
  html,body{width:210mm!important;margin:0!important;padding:0!important;background:#fff!important;height:auto!important;min-height:0!important;overflow:visible!important}
  #app{min-height:0!important;display:block!important}
  .topbar{display:none!important}
  main{display:block!important;padding:0!important;margin:0!important}
  .container{width:auto!important;max-width:none!important;margin:0!important;padding:0!important}
  #view-root> :not(#lookup-result){display:none!important}
  #lookup-result{display:block!important;margin:0!important;padding:0!important}
  #lookup-result> :not(#print-area){display:none!important}
  #print-area{display:block!important;position:static!important;width:210mm!important;margin:0!important;padding:0!important}
  #print-area,#print-area *{visibility:visible!important}
  .cert-stack{display:block!important;gap:0!important;margin:0!important;padding:0!important;width:210mm!important}
  .cert-page{width:209.5mm!important;height:296.5mm!important;min-height:296.5mm!important;max-height:296.5mm!important;box-shadow:none!important;margin:0 auto!important;overflow:hidden!important;page-break-inside:avoid!important;break-inside:avoid-page!important;page-break-after:always!important;break-after:page!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .cert-page:last-child{page-break-after:auto!important;break-after:auto!important}
  .no-print{display:none!important}
}

function deepMerge(base, extra){
  const out=Array.isArray(base)?[...base]:{...base};
  if(extra && typeof extra==='object') Object.keys(extra).forEach(k=>{
    if(extra[k] && typeof extra[k]==='object' && !Array.isArray(extra[k]) && base?.[k] && typeof base[k]==='object' && !Array.isArray(base[k])) out[k]=deepMerge(base[k],extra[k]); else out[k]=extra[k];
  });
  return out;
}
function hydrateSettings(raw){
  let s=deepMerge(DEFAULT_SETTINGS,raw||{});
  if(!Array.isArray(s.purposeOptions)||!s.purposeOptions.length)s.purposeOptions=[...DEFAULT_SETTINGS.purposeOptions];
  s.purposeOptions=s.purposeOptions.map(v=>String(v||'').trim()).filter(Boolean);
  if(s.companies){
    if(s.companies.jinhap)s.companies.jinhap.logo=LOGOS.jinhap;
    if(s.companies.jinos)s.companies.jinos.logo=LOGOS.jinos;
    if(s.companies.jnf){s.companies.jnf.logo=LOGOS.jnf;s.companies.jnf.siteAddresses={okcheon:'',daehwa:'',...(s.companies.jnf.siteAddresses||{})};}
    if(s.companies.jinwoo)s.companies.jinwoo.logo=LOGOS.jinwoo;
  }
  s.email={enabled:false,publicKey:'',serviceId:'',templateId:'',...(s.email||{})};
  return s;
}
async function loadSettings(adminMode=false){
  const db=requireOnline(); let raw={};
  if(adminMode){
    const {data,error}=await db.from('app_settings').select('data').eq('id','global').single();
    if(error)throw error; raw=data?.data||{};
    const {data:counters,error:ce}=await db.from('company_counters').select('company_key,base_code,counter');
    if(ce)throw ce;
    raw=hydrateSettings(raw);
    (counters||[]).forEach(x=>{const c=raw.companies?.[x.company_key];if(c){c.baseCode=x.base_code;c.counter=Number(x.counter)||0}});
    return raw;
  }
  const {data,error}=await db.rpc('get_public_settings');
  if(error)throw error; return hydrateSettings(data||{});
}
function settingsForStorage(s){

async function copyText(text){

function waitForCertificateAssets(el){
  const fontReady=document.fonts?.ready||Promise.resolve();
  const imgs=[...el.querySelectorAll('img')];
  const imageReady=Promise.all(imgs.map(img=>{
    if(img.complete&&img.naturalWidth>0)return Promise.resolve();
    return new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,2500)});
  }));
  return Promise.all([fontReady,imageReady,new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))]);
}
function pdfFileName(r){return `재직증명서_${r.name}_${r.certNumber.replace(/\s/g,'_')}.pdf`}
async function buildCertificatePdf(r,settings){
  if(typeof html2canvas==='undefined'||!window.jspdf?.jsPDF)throw new Error('PDF 모듈 로딩 실패');
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:0;top:0;width:210mm;background:#fff;z-index:2147483647;pointer-events:none;';
  host.innerHTML=certificatePagesHTML(r,settings);
  document.body.appendChild(host);
  try{
    await waitForCertificateAssets(host);
    const pages=[...host.querySelectorAll('.cert-page')];
    if(!pages.length)throw new Error('증명서 페이지를 찾지 못했습니다.');
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true,putOnlyUsedFonts:true});
    for(let i=0;i<pages.length;i++){
      const page=pages[i];
      page.classList.add('pdf-capture');
      await waitForCertificateAssets(page);
      const canvas=await html2canvas(page,{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0,width:page.scrollWidth,height:page.scrollHeight,windowWidth:page.scrollWidth,windowHeight:page.scrollHeight});
      // html2canvas/browser combinations can occasionally omit print gradients.
      // Paint the same top-right band directly on the captured canvas so the saved PDF always matches the preview.
      const ctx=canvas.getContext('2d');
      const bandW=canvas.width*0.37, bandH=canvas.height*(6/297), bandX=canvas.width-bandW;
      ctx.save();
      ctx.beginPath();ctx.moveTo(bandX,0);ctx.lineTo(canvas.width,0);ctx.lineTo(canvas.width,bandH);ctx.lineTo(bandX+bandW*0.08,bandH);ctx.closePath();ctx.clip();
      const bandGrad=ctx.createLinearGradient(bandX,0,canvas.width,0);
      bandGrad.addColorStop(0,'#5B9FD6');bandGrad.addColorStop(0.48,'#9DBCE8');bandGrad.addColorStop(1,'#CBD7EA');
      ctx.fillStyle=bandGrad;ctx.fillRect(bandX,0,bandW,bandH);ctx.restore();
      const img=canvas.toDataURL('image/jpeg',0.98);
      if(i>0)pdf.addPage('a4','portrait');
      pdf.addImage(img,'JPEG',0,0,210,297,undefined,'FAST');
    }
    return pdf;
  }finally{host.remove()}
}
async function downloadPdf(r,settings){
  const btn=document.getElementById('pdf-btn');

  }
}
function publicSiteUrl(){
  try{
    const u=new URL(window.location.href);
    u.hash='';u.search='';
    if(!u.pathname.endsWith('/'))u.pathname=u.pathname.replace(/[^/]*$/,'');
    return u.toString();
  }catch(e){return 'https://ksh-jinhap.github.io/employment-certificate/'}
}
async function sendApprovalEmail(r,settings){
  const cfg=settings.email||{};
  if(!cfg.enabled)return {status:'disabled',message:'자동 발송 미사용'};
  if(!cfg.publicKey||!cfg.serviceId||!cfg.templateId)return {status:'failed',message:'메일 발송 설정값이 비어 있습니다.'};
  if(typeof emailjs==='undefined')return {status:'failed',message:'메일 모듈을 불러오지 못했습니다.'};
  try{
    const siteUrl=publicSiteUrl();
    const message=`${r.name}님의 재직증명서 발급 신청이 승인되었습니다.\n\n증명번호 : ${r.certNumber}\n조회번호 : ${r.id}\n\n아래 사이트에서 조회번호와 성명을 입력한 뒤 재직증명서를 확인하거나 PDF로 저장해주세요.\n${siteUrl}`;
    emailjs.init({publicKey:cfg.publicKey});
    await emailjs.send(cfg.serviceId,cfg.templateId,{
      to_email:r.email,
      to_name:r.name,
      company_name:companyOf(settings,r.business,r.jnfSite).companyName,
      cert_number:r.certNumber,
      approved_date:fmtDateKR((r.approvedAt||'').slice(0,10)),
      request_id:r.id,
      site_url:siteUrl,
      message
    });
    return {status:'sent',message:'발송 완료'};
  }catch(e){
    console.error(e);
    return {status:'failed',message:String(e?.text||e?.message||e)};
  }
}

async function showRequest(id,settings){const r=state.requestsCache.find(x=>x.id===id)||(await loadRequests()).find(x=>x.id===id);if(!r)return;const c=companyOf(settings,r.business,r.jnfSite),extra=document.getElementById('admin-extra');extra.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>신청 상세</b><button class="btn btn-ghost btn-sm" id="close-extra">닫기</button></div><div class="form-grid"><div><span class="hint">사업자</span><div>${esc(requestCompanyLabel(settings,r))}</div></div><div><span class="hint">조회번호</span><div style="font-family:monospace;font-weight:700">${esc(r.id)}</div></div><div><span class="hint">성명</span><div>${esc(r.name)}</div></div><div><span class="hint">소속 / 직위</span><div>${esc(r.department)} / ${esc(r.position)}</div></div><div><span class="hint">주민등록번호</span><div>${esc(maskId(r.ssn))}</div></div><div><span class="hint">입사일</span><div>${fmtDateKR(r.startDate)}</div></div><div><span class="hint">용도 / 매수</span><div>${esc(r.purpose)} / ${r.copies}</div></div><div class="field full"><span class="hint">주소</span><div>${esc(r.address)}</div></div><div class="field full"><span class="hint">안내 메일</span><div>${esc(r.email)}</div></div></div>${r.status==='approved'?`<div style="margin-top:20px">${certificateHTML(r,settings,1,1)}</div>`:''}</div>`;document.getElementById('close-extra').onclick=()=>extra.innerHTML='';extra.scrollIntoView({behavior:'smooth'})}
function exportCSV(list,settings){const rows=[['상태','사업자','JNF 사업장','조회번호','성명','소속','직위','입사일','용도','매수','안내 메일','증명번호','신청일시','승인일시']];list.forEach(r=>{const c=companyOf(settings,r.business,r.jnfSite);rows.push([statusLabel(r.status),c.label,r.business==='jnf'?c.siteLabel:'',r.id,r.name,r.department,r.position,r.startDate,r.purpose,r.copies,r.email,r.certNumber||'',r.createdAt,r.approvedAt||''])});const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`재직증명서_발급기록_${todayISO()}.csv`;a.click();URL.revokeObjectURL(a.href)}

function renderSettings(settings){const extra=document.getElementById('admin-extra');extra.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>관리자 설정</b><button class="btn btn-ghost btn-sm" id="close-settings">닫기</button></div><form id="settings-form"><div class="section-title">사업자별 증명서 정보</div><div class="notice info" style="margin-bottom:14px"><b>JNF는 옥천·대화 주소를 각각 설정합니다.</b><br>신청자는 JNF 선택 후 사업장을 한 번 더 고르며, 실제 재직증명서에는 ‘옥천/대화’ 문구 없이 해당 주소만 표시됩니다.</div>${Object.values(settings.companies).map(c=>`<div style="border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:12px"><div style="display:flex;align-items:center;gap:12px"><img src="${c.logo}" style="max-height:34px;max-width:140px"><b>${esc(c.label)}</b></div><div style="min-width:180px;border:1px dashed #cbd5e1;border-radius:10px;padding:10px 12px;background:#fafcff;text-align:center"><div style="font-size:12px;color:#475569;font-weight:700;margin-bottom:6px">현재 연결된 대표이사 도장</div><img src="${companySealFor(c.key)}" alt="${esc(c.label)} 도장 미리보기" style="width:72px;height:72px;object-fit:contain;display:block;margin:0 auto 4px"><div style="font-size:11px;color:#64748b">증명서 출력 시 이 도장이 사용됩니다.</div></div></div><div class="settings-grid"><div class="field"><label>회사명</label><input data-co="${c.key}" data-k="companyName" value="${esc(c.companyName)}"></div><div class="field"><label>증명번호 코드</label><input data-co="${c.key}" data-k="baseCode" value="${esc(c.baseCode)}"></div>${c.key==='jnf'?`<div class="field full"><label>JNF 옥천 주소</label><input data-co="${c.key}" data-k="siteAddressOkcheon" value="${esc(c.siteAddresses?.okcheon||'')}"><div class="hint">신청자가 JNF → 옥천을 선택한 경우 증명서 하단에 이 주소가 표시됩니다.</div></div><div class="field full"><label>JNF 대화 주소</label><input data-co="${c.key}" data-k="siteAddressDaehwa" value="${esc(c.siteAddresses?.daehwa||'')}"><div class="hint">신청자가 JNF → 대화를 선택한 경우 증명서 하단에 이 주소가 표시됩니다.</div></div>`:`<div class="field full"><label>회사 주소</label><input data-co="${c.key}" data-k="companyAddress" value="${esc(c.companyAddress)}"></div>`}<div class="field"><label>대표자 성명</label><input data-co="${c.key}" data-k="ceoName" value="${esc(c.ceoName)}"></div><div class="field"><label>현재 발급 순번</label><input type="number" min="0" data-co="${c.key}" data-k="counter" value="${parseInt(c.counter)||0}"></div></div></div>`).join('')}
<div class="section-title" style="margin-top:20px">용도 드롭다운 관리</div>
<div class="notice info" style="margin-bottom:12px">신청 화면의 <b>용도</b> 선택 목록입니다. 아래에서 한 줄에 하나씩 입력하면 신청 화면에 그대로 표시됩니다.</div>
<div class="field full"><label>용도 목록</label><textarea id="purposeOptions" rows="9" style="resize:vertical;line-height:1.7">${esc(settings.purposeOptions.join('\n'))}</textarea><div class="hint">빈 줄은 저장 시 자동으로 제외되며, 같은 항목은 한 번만 저장됩니다.</div></div>
<div class="section-title" style="margin-top:20px">공통 설정</div><div class="settings-grid"><div class="field"><label>발급 부서</label><input id="issuerDept" value="${esc(settings.issuerDept)}"></div><div class="field"><label>발급 담당자</label><input id="issuerName" value="${esc(settings.issuerName)}"></div><div class="field full"><div class="notice info" style="margin:0">관리자 로그인 정보는 Supabase Authentication에서 관리합니다.</div></div></div>
<div class="section-title" style="margin-top:20px">승인 완료 메일 보내기 (선택)</div>
<div class="notice info"><b>이 기능은 무엇인가요?</b><br>관리자가 신청을 승인하면, 신청자가 입력한 메일로 <b>승인 안내·증명번호·조회번호·조회 사이트 링크</b>를 자동으로 보냅니다.<br><b>PDF 파일은 메일에 첨부하지 않으며, 신청자가 사이트에서 직접 PDF로 저장합니다.</b></div>
<div style="border:1px solid var(--line);border-radius:10px;padding:15px 16px;margin-bottom:15px;background:#FAFBFD;font-size:13px;line-height:1.7;color:#475569">
  <b style="color:var(--navy)">EmailJS 메일 양식 설정</b><br>
  ① 기존 Template의 <b>Attachments에서 pdf_base64 첨부 설정을 삭제</b>합니다.<br>
  ② 받는 사람(To)은 <b>{{to_email}}</b>로 설정합니다.<br>
  ③ 메일 본문에는 아래 변수들을 넣을 수 있습니다.
  <details style="margin-top:8px"><summary style="cursor:pointer;font-weight:700;color:var(--accent)">메일 양식에 넣을 변수 보기</summary><div style="margin-top:8px;padding-left:8px">성명: <b>{{to_name}}</b><br>회사명: <b>{{company_name}}</b><br>증명번호: <b>{{cert_number}}</b><br>승인일: <b>{{approved_date}}</b><br>조회번호: <b>{{request_id}}</b><br>조회 사이트: <b>{{site_url}}</b><br>전체 안내문: <b>{{message}}</b></div></details>
</div>
<div class="field" style="max-width:330px;margin-bottom:15px"><label>자동 메일 발송</label><select id="emailEnabled"><option value="false" ${settings.email.enabled?'':'selected'}>사용하지 않음</option><option value="true" ${settings.email.enabled?'selected':''}>승인 시 자동으로 발송</option></select><div class="hint">잘 모르겠으면 '사용하지 않음'으로 두셔도 됩니다.</div></div>
<div class="settings-grid" id="email-config-fields"><div class="field"><label>① Public Key</label><input id="emailPublicKey" value="${esc(settings.email.publicKey)}"><div class="hint">EmailJS의 Public Key를 복사해서 붙여넣기</div></div><div class="field"><label>② Service ID</label><input id="emailServiceId" value="${esc(settings.email.serviceId)}"><div class="hint">연결한 메일 서비스의 Service ID</div></div><div class="field"><label>③ Template ID</label><input id="emailTemplateId" value="${esc(settings.email.templateId)}"><div class="hint">만든 메일 양식의 Template ID</div></div></div>
<div class="btn-row"><button type="submit" class="btn btn-primary">설정 저장</button></div></form></div>`;
  document.getElementById('close-settings').onclick=()=>extra.innerHTML='';const emailEnabledEl=document.getElementById('emailEnabled'),emailFieldsEl=document.getElementById('email-config-fields');const toggleEmailFields=()=>{if(emailFieldsEl)emailFieldsEl.style.display=emailEnabledEl.value==='true'?'grid':'none'};emailEnabledEl.onchange=toggleEmailFields;toggleEmailFields();document.getElementById('settings-form').onsubmit=async e=>{e.preventDefault();document.querySelectorAll('[data-co][data-k]').forEach(el=>{const c=settings.companies[el.dataset.co],k=el.dataset.k;if(k==='siteAddressOkcheon'){c.siteAddresses=c.siteAddresses||{};c.siteAddresses.okcheon=el.value.trim()}else if(k==='siteAddressDaehwa'){c.siteAddresses=c.siteAddresses||{};c.siteAddresses.daehwa=el.value.trim()}else{c[k]=k==='counter'?Math.max(0,parseInt(el.value)||0):el.value.trim()}});const purposeLines=document.getElementById('purposeOptions').value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);settings.purposeOptions=[...new Set(purposeLines)];if(!settings.purposeOptions.length){alert('용도 목록을 1개 이상 입력해주세요.');return}settings.issuerDept=document.getElementById('issuerDept').value.trim();settings.issuerName=document.getElementById('issuerName').value.trim();settings.email.enabled=document.getElementById('emailEnabled').value==='true';settings.email.publicKey=document.getElementById('emailPublicKey').value.trim();settings.email.serviceId=document.getElementById('emailServiceId').value.trim();settings.email.templateId=document.getElementById('emailTemplateId').value.trim();await saveSettings(settings);alert('저장되었습니다.');extra.innerHTML=''};extra.scrollIntoView({behavior:'smooth'})
}
render();
</script>
</body>
</html>
